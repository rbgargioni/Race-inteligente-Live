<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entradas para Analisar - Race Inteligente LIVE</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topo">
    <div class="logo-area">
        <div class="logo-circle">RI</div>
        <div>
            <h1>Entradas para Analisar</h1>
            <p>Cadastre os jogos que serão monitorados aos 65 minutos</p>
        </div>
    </div>
</header>

<main class="container">

    <!-- Cadastro de nova entrada -->
    <section class="card">
        <h2>Nova Entrada</h2>

        <label for="dataJogo">Data</label>
        <input type="date" id="dataJogo">

        <label for="liga">Competição</label>
        <select id="liga">
            <option value="">Carregando ligas...</option>
        </select>

        <label for="rodada">Rodada</label>
        <input type="text" id="rodada" placeholder="Ex: 2ª Fase - Volta">

        <label for="timeCasa">Time Casa</label>
        <select id="timeCasa">
            <option value="">Selecione primeiro uma liga...</option>
        </select>

        <label for="timeVisitante">Time Visitante</label>
        <select id="timeVisitante">
            <option value="">Selecione primeiro uma liga...</option>
        </select>

        <label for="favorito">Favorito</label>
        <select id="favorito">
            <option value="">Selecione o favorito</option>
        </select>

        <label for="oddPreLive">Odd Pré-Live</label>
        <input type="number" step="0.01" id="oddPreLive" placeholder="Ex: 1.72">

        <button id="btnAdicionarEntrada" class="btn-success">
            Adicionar Entrada no Firestore
        </button>
    </section>

    <!-- Lista de entradas -->
    <section class="card">
        <h2>Jogos Monitorados</h2>
        <div id="listaEntradas">Carregando jogos do banco...</div>
    </section>

    <a href="index.html" class="btn" style="margin-top: 15px; display: inline-block;">Voltar ao Início</a>

</main>

<footer class="rodape">
    Race Inteligente LIVE Cloud v0.1 Alpha
</footer>

<!-- Módulo do Firebase para gerenciar as Entradas -->
<script type="module">
    import { db } from './js/firebase-config.js';
    import { mostrarNotificacao, mostrarConfirmacao } from './js/ui-modal.js';
    import { 
        collection, 
        addDoc, 
        getDocs, 
        deleteDoc, 
        doc
    } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

    let todosOsTimes = []; // Cache local para filtragem rápida por liga

    // 1. Carrega Ligas do Firestore
    async function carregarLigas() {
        const select = document.getElementById("liga");
        try {
            const querySnapshot = await getDocs(collection(db, "ri_ligas"));
            select.innerHTML = '<option value="">Selecione uma liga</option>';

            querySnapshot.forEach(docSnap => {
                const liga = docSnap.data();
                const option = document.createElement("option");
                option.value = liga.nome;
                option.textContent = liga.nome;
                select.appendChild(option);
            });
        } catch (error) {
            console.error("Erro ao carregar ligas:", error);
            select.innerHTML = '<option value="">Erro ao carregar ligas</option>';
        }
    }

    // 2. Carrega todos os times do Firestore uma única vez
    async function carregarTimesDoBanco() {
        try {
            const querySnapshot = await getDocs(collection(db, "ri_times"));
            todosOsTimes = [];

            querySnapshot.forEach(docSnap => {
                todosOsTimes.push(docSnap.data());
            });

            // Ordenação alfabética
            todosOsTimes.sort((a, b) => a.nome.localeCompare(b.nome));

            atualizarSelectsDeTimes();
        } catch (error) {
            console.error("Erro ao carregar times:", error);
            document.getElementById("timeCasa").innerHTML = '<option value="">Erro ao carregar times</option>';
            document.getElementById("timeVisitante").innerHTML = '<option value="">Erro ao carregar times</option>';
        }
    }

    // 3. Filtra os times de acordo com a Liga selecionada
    function atualizarSelectsDeTimes() {
        const casa = document.getElementById("timeCasa");
        const visitante = document.getElementById("timeVisitante");
        const ligaSelecionada = document.getElementById("liga").value;

        casa.innerHTML = '<option value="">Selecione o time da casa</option>';
        visitante.innerHTML = '<option value="">Selecione o time visitante</option>';

        // Se houver liga selecionada, filtra; caso contrário, exibe todos
        const timesFiltrados = ligaSelecionada 
            ? todosOsTimes.filter(time => time.liga === ligaSelecionada)
            : todosOsTimes;

        if (timesFiltrados.length === 0) {
            const optVazia = document.createElement("option");
            optVazia.value = "";
            optVazia.textContent = "Nenhum time cadastrado nesta liga";
            casa.appendChild(optVazia);
            visitante.appendChild(optVazia.cloneNode(true));
            return;
        }

        timesFiltrados.forEach(time => {
            const o1 = document.createElement("option");
            o1.value = time.nome;
            o1.textContent = time.nome;

            const o2 = o1.cloneNode(true);

            casa.appendChild(o1);
            visitante.appendChild(o2);
        });

        atualizarSelectFavorito();
    }

    // 4. Atualiza as opções do select de Favorito dinamicamente
    function atualizarSelectFavorito() {
        const casa = document.getElementById("timeCasa").value;
        const visitante = document.getElementById("timeVisitante").value;
        const favorito = document.getElementById("favorito");

        favorito.innerHTML = '<option value="">Selecione o favorito</option>';

        if (casa) {
            const o1 = document.createElement("option");
            o1.value = casa;
            o1.textContent = `Casa: ${casa}`;
            favorito.appendChild(o1);
        }

        if (visitante) {
            const o2 = document.createElement("option");
            o2.value = visitante;
            o2.textContent = `Visitante: ${visitante}`;
            favorito.appendChild(o2);
        }

        if (casa || visitante) {
            const o3 = document.createElement("option");
            o3.value = "Empate / Equilibrado";
            o3.textContent = "Empate / Equilibrado";
            favorito.appendChild(o3);
        }
    }

    // Listeners para filtros interativos
    document.getElementById("liga").addEventListener("change", atualizarSelectsDeTimes);
    document.getElementById("timeCasa").addEventListener("change", atualizarSelectFavorito);
    document.getElementById("timeVisitante").addEventListener("change", atualizarSelectFavorito);

    // 5. Renderiza Entradas salvas no Firestore
    async function renderEntradas() {
        const lista = document.getElementById("listaEntradas");
        lista.innerHTML = "<p style='color:#94a3b8'>Buscando jogos monitorados do Firestore...</p>";

        try {
            const querySnapshot = await getDocs(collection(db, "ri_entradas"));

            if (querySnapshot.empty) {
                lista.innerHTML = "<p style='color:#94a3b8'>Nenhum jogo cadastrado no Firestore.</p>";
                return;
            }

            lista.innerHTML = "";

            querySnapshot.forEach(docSnap => {
                const jogo = { id: docSnap.id, ...docSnap.data() };

                const card = document.createElement("div");
                card.className = "card";
                card.style.border = "1px solid #334155";
                card.style.marginBottom = "10px";

                card.innerHTML = `
                    <h3>${jogo.casa} x ${jogo.visitante}</h3>
                    <p><strong>Liga:</strong> ${jogo.liga || '-'}</p>
                    <p><strong>Data:</strong> ${jogo.data || '-'}</p>
                    <p><strong>Favorito:</strong> ${jogo.favorito || '-'}</p>
                    <p><strong>Odd Pré-Live:</strong> ${jogo.oddPreLive || '-'}</p>
                    <p><strong>Status:</strong> <span style="color:#22c55e">${jogo.status || 'Aguardando'}</span></p>

                    <div style="margin-top:16px; display:flex; gap:12px; flex-wrap:wrap;">
                        <a href="live.html?id=${jogo.id}" class="btn">
                            Analisar
                        </a>
                        <button class="btn-danger btn-excluir" data-id="${jogo.id}">
                            Excluir
                        </button>
                    </div>
                `;

                lista.appendChild(card);
            });
        } catch (error) {
            console.error("Erro ao carregar entradas:", error);
            lista.innerHTML = "<p style='color:#ef4444'>Erro ao carregar entradas do banco de dados.</p>";
        }
    }

    // 6. Excluir Entrada usando Modal de Confirmação Personalizado
    async function excluirEntrada(idDoc) {
        const confirmou = await mostrarConfirmacao("Deseja mesmo remover esta entrada do monitoramento?", "Excluir Jogo");
        if (!confirmou) return;

        try {
            await deleteDoc(doc(db, "ri_entradas", idDoc));
            await mostrarNotificacao("Jogo removido do banco com sucesso!", "Sucesso ⚽");
            await renderEntradas();
        } catch (error) {
            console.error("Erro ao excluir entrada:", error);
            await mostrarNotificacao("Erro ao excluir o jogo.", "Erro");
        }
    }

    // Listener para o botão Excluir
    document.getElementById("listaEntradas").addEventListener("click", (e) => {
        if (e.target.classList.contains("btn-excluir")) {
            const id = e.target.getAttribute("data-id");
            if (id) excluirEntrada(id);
        }
    });

    // 7. Adicionar Nova Entrada no Firestore
    document.getElementById("btnAdicionarEntrada").addEventListener("click", async () => {
        const btn = document.getElementById("btnAdicionarEntrada");

        const jogo = {
            data: document.getElementById("dataJogo").value,
            liga: document.getElementById("liga").value,
            rodada: document.getElementById("rodada").value,
            casa: document.getElementById("timeCasa").value,
            visitante: document.getElementById("timeVisitante").value,
            favorito: document.getElementById("favorito").value,
            oddPreLive: document.getElementById("oddPreLive").value,
            minuto: "65'",
            status: "Aguardando",
            criadoEm: new Date()
        };

        if (!jogo.data || !jogo.liga || !jogo.casa || !jogo.visitante || !jogo.favorito) {
            await mostrarNotificacao("Preencha todos os campos obrigatórios (Data, Liga, Times e Favorito).", "Atenção");
            return;
        }

        btn.disabled = true;
        btn.textContent = "Salvando na Nuvem...";

        try {
            await addDoc(collection(db, "ri_entradas"), jogo);

            await mostrarNotificacao("Jogo cadastrado com sucesso no Firestore!", "Sucesso ⚽");

            // Limpa o formulário
            document.getElementById("dataJogo").value = "";
            document.getElementById("liga").value = "";
            document.getElementById("rodada").value = "";
            document.getElementById("timeCasa").value = "";
            document.getElementById("timeVisitante").value = "";
            document.getElementById("favorito").value = "";
            document.getElementById("oddPreLive").value = "";

            atualizarSelectsDeTimes();
            await renderEntradas();
        } catch (error) {
            console.error("Erro ao adicionar entrada:", error);
            await mostrarNotificacao("Erro ao salvar jogo no Firestore.", "Erro");
        } finally {
            btn.disabled = false;
            btn.textContent = "Adicionar Entrada no Firestore";
        }
    });

    // Execução Inicial Assíncrona
    await carregarLigas();
    await carregarTimesDoBanco();
    await renderEntradas();
</script>

</body>
</html>
