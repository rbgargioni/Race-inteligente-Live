<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico - Race Inteligente LIVE</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topo">
    <div class="logo-area">
        <div class="logo-circle">RI</div>
        <div>
            <h1>Histórico de Análises</h1>
            <p>Todas as análises realizadas pelo Race Inteligente</p>
        </div>
    </div>
</header>

<main class="container">

    <!-- Resumo -->

    <section class="card">

        <h2>Resumo</h2>

        <div class="painel-grid">

            <div class="painel-item">
                <span>Total de Análises</span>
                <strong id="totalAnalises">0</strong>
            </div>

            <div class="painel-item">
                <span>IQP Médio</span>
                <strong id="iqpMedio">0</strong>
            </div>

            <div class="painel-item">
                <span>Entradas Premium</span>
                <strong id="totalPremium">0</strong>
            </div>

            <div class="painel-item">
                <span>Entradas Fortes</span>
                <strong id="totalFortes">0</strong>
            </div>

        </div>

    </section>

    <!-- Histórico -->

    <section class="card">

        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">

            <h2>Histórico</h2>

            <button id="btnLimparHistorico" class="btn-danger">
                Limpar Histórico
            </button>

        </div>

        <div id="listaHistorico" style="margin-top:20px;"></div>

    </section>

    <a href="index.html" class="btn">Voltar ao Início</a>

</main>

<footer class="rodape">
    Race Inteligente LIVE Cloud v0.1 Alpha
</footer>

<script src="js/app.js"></script>

<script>

function renderHistorico() {

    const historico = RaceInteligente.obterHistorico();

    const lista = document.getElementById("listaHistorico");

    // ==========================
    // Resumo
    // ==========================

    document.getElementById("totalAnalises").textContent = historico.length;

    if (historico.length > 0) {

        const media = historico.reduce((s, i) => s + Number(i.iqp), 0) / historico.length;

        document.getElementById("iqpMedio").textContent = media.toFixed(1);

        const premium = historico.filter(i => i.classificacao === "PREMIUM").length;
        const fortes = historico.filter(i => i.classificacao === "FORTE").length;

        document.getElementById("totalPremium").textContent = premium;
        document.getElementById("totalFortes").textContent = fortes;

    } else {

        document.getElementById("iqpMedio").textContent = "0";
        document.getElementById("totalPremium").textContent = "0";
        document.getElementById("totalFortes").textContent = "0";

    }

    // ==========================
    // Lista
    // ==========================

    if (historico.length === 0) {

        lista.innerHTML = "<p style='color:#94a3b8'>Nenhuma análise registrada.</p>";
        return;

    }

    lista.innerHTML = "";

    historico.forEach(item => {

        const card = document.createElement("div");
        card.className = "card";

        let classe = "status-nao";

        if (item.classificacao === "PREMIUM") classe = "status-premium";
        if (item.classificacao === "FORTE") classe = "status-forte";
        if (item.classificacao === "MODERADA") classe = "status-moderada";

        card.innerHTML = `

            <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">

                <h3>${item.jogo}</h3>

                <span class="status ${classe}">
                    ${item.classificacao}
                </span>

            </div>

            <p><strong>Data:</strong> ${item.data}</p>
            <p><strong>Minuto:</strong> ${item.minuto}'</p>
            <p><strong>IQP:</strong> ${item.iqp}</p>
            <p><strong>Odd:</strong> ${item.odd}</p>

            <hr style="border:none; border-top:1px solid #334155; margin:16px 0;">

            <p><strong>Posse:</strong> ${item.posse}%</p>
            <p><strong>Ataques:</strong> ${item.ataques}</p>
            <p><strong>Ataques Perigosos:</strong> ${item.ataquesPerigosos}</p>
            <p><strong>Finalizações:</strong> ${item.finalizacoes}</p>
            <p><strong>No Alvo:</strong> ${item.noAlvo}</p>
            <p><strong>Escanteios:</strong> ${item.escanteios}</p>

            <hr style="border:none; border-top:1px solid #334155; margin:16px 0;">

            <p><strong>Precisava vencer:</strong>
                ${item.precisaVencer ? "Sim" : "Não"}
            </p>

            <p><strong>Expulsão do adversário:</strong>
                ${item.expulsaoAdversario ? "Sim" : "Não"}
            </p>

        `;

        lista.appendChild(card);

    });

}

document.getElementById("btnLimparHistorico").addEventListener("click", () => {

    if (!confirm("Deseja apagar todo o histórico?")) return;

    RaceInteligente.salvarHistorico([]);

    renderHistorico();

});

renderHistorico();

</script>

</body>
</html>
