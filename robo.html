<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robô de Operações - RI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header no padrão do sistema -->
    <header class="topo">
        <div class="logo-area">
            <div class="logo-circle">RI</div>
            <div>
                <h1>Robô de Operações</h1>
                <p>Gerenciamento e automação de entradas</p>
            </div>
        </div>
    </header>

    <!-- Conteúdo principal envelopado no .container -->
    <main class="container">
        
        <!-- Seção de Status do Robô -->
        <section class="card">
            <h2>Status do Robô</h2>
            <div class="status-grid">
                <div class="status-item">
                    <span class="label">Estado atual:</span>
                    <span class="badge badge-success" id="robot-status">Ativo</span>
                </div>
                <div class="status-item">
                    <span class="label">Modo:</span>
                    <span id="robot-mode">Simulação</span>
                </div>
            </div>
            
            <div class="acoes-grid" style="margin-top: 20px;">
                <button type="button" class="btn btn-primary" id="btn-iniciar">Iniciar Robô</button>
                <button type="button" class="btn btn-danger" id="btn-parar">Parar Robô</button>
            </div>
        </section>

        <!-- Seção de Configurações -->
        <section class="card" style="margin-top: 20px;">
            <h2>Configurações do Robô</h2>
            <form id="form-config-robo">
                <div class="form-group">
                    <label for="payout-minimo">Payout Mínimo (%)</label>
                    <input type="number" id="payout-minimo" name="payout-minimo" class="form-control" value="80">
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label for="val-entrada">Valor Base da Entrada (R$)</label>
                    <input type="number" id="val-entrada" name="val-entrada" class="form-control" value="10">
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label for="stop-loss">Stop Loss (R$)</label>
                    <input type="number" id="stop-loss" name="stop-loss" class="form-control" value="50">
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label for="stop-gain">Stop Gain (R$)</label>
                    <input type="number" id="stop-gain" name="stop-gain" class="form-control" value="100">
                </div>

                <div style="margin-top: 20px;">
                    <button type="submit" class="btn btn-primary">Salvar Configurações</button>
                </div>
            </form>
        </section>

        <!-- Seção de Logs de Operação -->
        <section class="card" style="margin-top: 20px;">
            <h2>Logs de Execução</h2>
            <div id="log-container" class="log-box">
                <p class="log-item">[06:00:00] Sistema inicializado com sucesso.</p>
                <p class="log-item">[06:00:05] Conectado ao servidor de sinais...</p>
            </div>
        </section>

        <!-- Navegação de volta -->
        <div style="margin-top: 20px; text-align: center;">
            <a href="index.html" class="btn btn-secondary">Voltar ao Início</a>
        </div>

    </main>

</body>
</html>
