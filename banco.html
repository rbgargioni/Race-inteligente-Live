<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco de Dados - Race Inteligente LIVE</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topo">
    <div class="logo-area">
        <div class="logo-circle">RI</div>
        <div>
            <h1>Banco de Dados</h1>
            <p>Gerenciamento de ligas e times (Firestore Cloud)</p>
        </div>
    </div>
</header>

<main class="container">

    <!-- Cadastro de Liga -->
    <section class="card">
        <h2>Nova Liga</h2>

        <label for="nomeLiga">Nome da Liga</label>
        <input type="text" id="nomeLiga" placeholder="Ex: Champions League">

        <label for="paisLiga">País / Organização</label>
        <input type="text" id="paisLiga" placeholder="Ex: UEFA">

        <label for="nivelLiga">Nível Técnico (1 a 5)</label>
        <select id="nivelLiga">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5" selected>5</option>
        </select>

        <button id="btnAdicionarLiga" class="btn-success">
            Adicionar Liga no Firestore
        </button>
    </section>

    <!-- Cadastro de Time -->
    <section class="card">
        <h2>Novo Time</h2>

        <label for="nomeTime">Nome do Time</label>
        <input type="text" id="nomeTime" placeholder="Ex: Dinamo Zagreb">

        <label for="ligaTime">Liga</label>
        <select id="ligaTime"></select>

        <label for="forcaTime">Força Técnica (1 a 5)</label>
        <select id="forcaTime">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5" selected>5</option>
        </select>

        <button id="btnAdicionarTime" class="btn-success">
            Adicionar Time
        </button>
    </section>

    <!-- Ligas -->
    <section class="card">
        <h2>Ligas Cadastradas (Nuvem)</h2>
        <div id="listaLigas">Carregando ligas do Firestore...</div>
    </section>

    <!-- Times -->
    <section class="card">
        <h2>Times Cadastrados</h2>
        <div id="listaTimes"></div>
    </section>

    <a href="index.html" class="btn">Voltar ao Início</a>

</main>

<footer class="rodape">
    Race Inteligente LIVE Cloud v0.1 Alpha
</footer>

<script src="js/app.js"></script>

<!-- Conexão com Firestore usando Módulos JS -->
<script type="module">
    import { 
        adicionarLigaFirestore, 
        obterLigasFirestore, 
        removerLigaFirestore 
    } from './js/firebase-config.js';

    // Tornar funções globais para permitir o onclick nos botões gerados dinamicamente
    window.removerLigaNuvem = async function(id) {
        if (!confirm("Deseja remover esta liga do Firestore?")) return;
        try {
            await removerLigaFirestore(id);
            await carregarLigasEGrid();
        } catch (e) {
            alert("Erro ao remover liga.");
        }
    };

    async function carregarLigasEGrid() {
        const lista = document.getElementById("listaLigas");
        const select = document.getElementById("ligaTime");

        lista.innerHTML = "Carregando ligas do Firestore...";
        select.innerHTML = "";

        const ligas = await obterLigasFirestore();

        // Atualizar Select
        if (ligas.length === 0) {
            lista.innerHTML = "<p style='color:#94a3b8'>Nenhuma liga cadastrada no Firestore.</p>";
            return;
        }

        lista.innerHTML = "";

        ligas.forEach((liga) => {
            // Opção no Select de Times
            const option = document.createElement("option");
            option.value = liga.nome;
            option.textContent = liga.nome;
            select.appendChild(option);

            // Card na Lista de Ligas
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <h3>${liga.nome}</h3>
                <p><strong>País:</strong> ${liga.pais}</p>
                <p><strong>Nível:</strong> ${liga.nivel}</p>
                <button class="btn-danger" onclick="window.removerLigaNuvem('${liga.id}')">
                    Remover
                </button>
            `;
            lista.appendChild(card);
        });
    }

    // Event Listener do Botão de Cadastro
    document.getElementById("btnAdicionarLiga").addEventListener("click", async () => {
        const nome = document.getElementById("nomeLiga").value.trim();
        const pais = document.getElementById("paisLiga").value.trim();
        const nivel = document.getElementById("nivelLiga").value;

        if (!nome || !pais) {
            alert("Preencha os campos da liga.");
            return;
        }

        const btn = document.getElementById("btnAdicionarLiga");
        btn.disabled = true;
        btn.textContent = "Salvando...";

        try {
            await adicionarLigaFirestore({ nome, pais, nivel });
            document.getElementById("nomeLiga").value = "";
            document.getElementById("paisLiga").value = "";
            alert("Liga cadastrada com sucesso no Firestore!");
            await carregarLigasEGrid();
        } catch (e) {
            alert("Erro ao salvar no Firestore. Verifique se as regras do banco permitem escrita.");
        } finally {
            btn.disabled = false;
            btn.textContent = "Adicionar Liga no Firestore";
        }
    });

    // Funções legadas para Times (Local)
    function renderTimes() {
        const times = RaceInteligente.obterTimes();
        const lista = document.getElementById("listaTimes");
        lista.innerHTML = "";

        times.forEach((time, index) => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <h3>${time.nome}</h3>
                <p><strong>Liga:</strong> ${time.liga}</p>
                <p><strong>Força:</strong> ${time.forca}</p>
                <button class="btn-danger" onclick="removerTimeLocal(${index})">
                    Remover
                </button>
            `;
            lista.appendChild(card);
        });
    }

    window.removerTimeLocal = function(index) {
        const times = RaceInteligente.obterTimes();
        times.splice(index, 1);
        localStorage.setItem("ri_times", JSON.stringify(times));
        renderTimes();
    };

    document.getElementById("btnAdicionarTime").addEventListener("click", () => {
        const nome = document.getElementById("nomeTime").value.trim();
        const liga = document.getElementById("ligaTime").value;
        const forca = document.getElementById("forcaTime").value;

        if (!nome || !liga) {
            alert("Preencha os campos do time.");
            return;
        }

        const times = RaceInteligente.obterTimes();
        times.push({ nome, liga, forca });
        localStorage.setItem("ri_times", JSON.stringify(times));
        document.getElementById("nomeTime").value = "";
        renderTimes();
    });

    // Inicialização ao carregar a página
    carregarLigasEGrid();
    renderTimes();
</script>

</body>
</html>
